# docker compose up -d   (set RXPOS_SYNC_KEY in a .env file next to this file first)
services:
  hub:
    build: .
    restart: unless-stopped
    environment:
      RXPOS_SYNC_KEY: ${RXPOS_SYNC_KEY:?Set RXPOS_SYNC_KEY to a secret of 12+ characters}
    ports:
      - "8686:8686"
    volumes:
      - hub-data:/data

volumes:
  hub-data:
