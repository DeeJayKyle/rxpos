<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3b37" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>RxPOS</title>
    <script>
      // Pharmacy web addresses are /<pharmacy> (no trailing slash, so ./assets resolve from the site root)
      if (/^\/[a-z0-9-]+\/+$/.test(location.pathname)) location.replace(location.pathname.replace(/\/+$/, '') + location.search + location.hash);
    </script>
    <style>
      /* Splash: shown instantly while the app loads, removed by main.jsx once RxPOS is ready */
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; align-content: center; gap: 18px;
        background: radial-gradient(700px 420px at 50% 35%, #0f766e 0%, #0b3b37 45%, #05201e 100%); color: #ecfdf5;
        font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; transition: opacity .35s ease, visibility .35s; }
      #splash.done { opacity: 0; visibility: hidden; }
      #splash .mark { position: relative; width: 108px; height: 108px; }
      #splash .mark svg { width: 100%; height: 100%; filter: drop-shadow(0 18px 36px rgba(16, 185, 129, .35)); animation: rx-pop .7s cubic-bezier(.2, .9, .3, 1.25) both; }
      #splash .cross { stroke: #fff; stroke-width: 2.4; fill: #fff; fill-opacity: 0; stroke-dasharray: 160; stroke-dashoffset: 160; animation: rx-draw .7s .15s ease-out forwards, rx-fill .3s .7s ease-out forwards; }
      #splash .capsule { transform-origin: 32px 32px; opacity: 0; animation: rx-capsule .45s .75s cubic-bezier(.2, .9, .3, 1.3) forwards; }
      #splash .ring { position: absolute; inset: -14px; border-radius: 34px; border: 2px solid rgba(110, 231, 183, .55); opacity: 0; animation: rx-pulse 1.6s 1s ease-out infinite; }
      #splash .word { font-size: 30px; font-weight: 800; letter-spacing: -.02em; opacity: 0; animation: rx-up .5s .55s ease-out forwards; }
      #splash .word b { color: #6ee7b7; font-weight: 800; }
      #splash .tag { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; opacity: 0; color: #a7f3d0; animation: rx-up .5s .75s ease-out forwards; }
      #splash .ecg { width: 160px; height: 24px; opacity: .8; }
      #splash .ecg path { fill: none; stroke: #6ee7b7; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 220; stroke-dashoffset: 220; animation: rx-draw 1.4s .9s ease-in-out infinite; }
      @keyframes rx-pop { from { transform: scale(.6) rotate(-8deg); opacity: 0; } }
      @keyframes rx-draw { to { stroke-dashoffset: 0; } }
      @keyframes rx-fill { to { fill-opacity: 1; } }
      @keyframes rx-capsule { from { opacity: 0; transform: translateY(-14px) scale(.7) rotate(-20deg); } to { opacity: 1; transform: none; } }
      @keyframes rx-pulse { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }
      @keyframes rx-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation-duration: 1ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading RxPOS">
      <div class="mark">
        <span class="ring"></span>
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset=".55" stop-color="#0d9488"/><stop offset="1" stop-color="#10b981"/></linearGradient>
            <clipPath id="sc"><rect x="27" y="18" width="10" height="28" rx="5" transform="rotate(45 32 32)"/></clipPath>
          </defs>
          <rect width="64" height="64" rx="15" fill="url(#sg)"/>
          <path class="cross" d="M26.5 12h11a2.5 2.5 0 0 1 2.5 2.5V24h9.5a2.5 2.5 0 0 1 2.5 2.5v11a2.5 2.5 0 0 1-2.5 2.5H40v9.5a2.5 2.5 0 0 1-2.5 2.5h-11a2.5 2.5 0 0 1-2.5-2.5V40h-9.5A2.5 2.5 0 0 1 12 37.5v-11A2.5 2.5 0 0 1 14.5 24H24v-9.5a2.5 2.5 0 0 1 2.5-2.5z"/>
          <g class="capsule">
            <g clip-path="url(#sc)"><rect x="18" y="18" width="28" height="14" fill="#0d9488"/><rect x="18" y="32" width="28" height="14" fill="#f59e0b"/></g>
            <rect x="27" y="18" width="10" height="28" rx="5" transform="rotate(45 32 32)" fill="none" stroke="#fff" stroke-width="1.6"/>
          </g>
        </svg>
      </div>
      <div class="word">Rx<b>POS</b></div>
      <svg class="ecg" viewBox="0 0 160 24" aria-hidden="true"><path d="M2 12h44l6-9 8 18 7-14 5 5h86"/></svg>
      <div class="tag">Pharmacy point of sale</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
