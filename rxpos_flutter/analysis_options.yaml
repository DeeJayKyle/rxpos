include: package:flutter_lints/flutter.yaml

analyzer:
  # Generated by build_runner (Freezed, json_serializable, Drift, Riverpod): not analysed
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - windows/**
    - build/**
    - android/**
    - windows/**
    - web/**
  errors:
    # Freezed's documented way to configure json_serializable is an annotation on the factory constructor
    invalid_annotation_target: ignore

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_dynamic_calls: true
