name: Android update check

# Diagnosis: does an installed Android app update itself from the live site? Builds the app as an older build, runs it
# on an emulator, lets it find and download the live update (public files at rxposug.com, nothing is changed there)
# and prints the updater's log. No sign-in, no pharmacy data.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Build as an older build (the build number is the last commit's time; this commit stays on the runner)
        run: |
          git -c user.name=ci -c user.email=ci@example.invalid commit -q --allow-empty -m "older build" --date="2026-10-27T06:25:00Z"
          GIT_COMMITTER_DATE="2026-10-27T06:25:00Z" git -c user.name=ci -c user.email=ci@example.invalid commit -q --amend --no-edit --allow-empty --date="2026-10-27T06:25:00Z"
          npm run build
          node -p "require('./dist/version.json').label"
      - name: Android project (as in build.yml)
        run: |
          rm -rf dist/updates
          npx cap add android
          npx cap sync android
          printf '\nallprojects { configurations.all { resolutionStrategy { force "androidx.work:work-runtime:2.9.1" } } }\n' >> android/build.gradle
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on an emulator and watch the update
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell monkey -p io.github.rxpos -c android.intent.category.LAUNCHER 1
            sleep 330
            adb logcat -d > logcat.txt || true
            echo "---- updater and WorkManager ----"
            grep -iE "CapacitorUpdater|Capacitor-updater|capgo|WM-|DownloadService|Capacitor/Console" logcat.txt | grep -viE "chromium.*Uncaught \(in promise\) undefined" | tail -250 || true
            echo "---- bundle folder ----"
            adb shell run-as io.github.rxpos ls -laR files 2>/dev/null | head -40 || true
