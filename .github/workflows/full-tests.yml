name: Full test suite

# Every RxPOS suite (tests/run-all.mjs): builds the app, starts a throw-away local cloud (wrangler dev) and drives the
# app in headless Chrome. build.yml calls it on every push and pull request to main and gates releases and deploys on
# it; deploy-cloud.yml gates on it too, so nothing reaches rxposug.com without passing it. Can also be run on demand.
#
# Fast (2026-11): the suites run side by side on several machines (RXPOS_SHARD): 8 groups against the local cloud and
# 2 against the self-hosted hub, made even by time (tests/suite-times.json), about 7 minutes instead of 44 one after the
# other. And code that already passed is
# not tested again: a pass is recorded as an artifact named after the code's git tree (identical files = identical
# tree), so the push to main after a pull request, and the release of that commit, reuse the pull request's pass. A
# manual run of this workflow always tests (reuse: false).
on:
  workflow_dispatch:
    inputs:
      reuse:
        description: 'Skip the tests when this exact code already passed them'
        type: boolean
        default: false
  workflow_call:
    inputs:
      reuse:
        type: boolean
        default: true

permissions:
  contents: read
  actions: read # to find an earlier pass of the same code

jobs:
  # has this exact code (same git tree) already passed? Then nothing needs to run again.
  check:
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tree
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - id: find
        if: inputs.reuse
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: full-tests-passed-${{ steps.tree.outputs.tree }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$NAME&per_page=5" --jq '[.artifacts[] | select(.expired == false)] | length' || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::This exact code (tree ${{ steps.tree.outputs.tree }}) already passed every suite: not run again."
          fi

  shard:
    needs: check
    if: needs.check.outputs.passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: cloud, shard: '0/8' }
          - { target: cloud, shard: '1/8' }
          - { target: cloud, shard: '2/8' }
          - { target: cloud, shard: '3/8' }
          - { target: cloud, shard: '4/8' }
          - { target: cloud, shard: '5/8' }
          - { target: cloud, shard: '6/8' }
          - { target: cloud, shard: '7/8' }
          - { target: hub, shard: '0/2' }
          - { target: hub, shard: '1/2' }
    name: ${{ matrix.target }} ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the classic app's build number is its last change (scripts/release-files.mjs)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # wrangler needs Node 22+
          cache: npm
      - run: npm ci
      - name: Run this group of suites (${{ matrix.target == 'hub' && 'self-hosted hub, server/hub.mjs on Node''s SQLite' || 'local cloud' }})
        shell: bash # explicit bash runs with -o pipefail, so a failing suite isn't hidden by tee
        env:
          CHROME_PATH: /usr/bin/google-chrome
          # suites that need services this machine can't reach (Workers AI, Open-Meteo, a screen) are skipped, not failed
          RXPOS_CI: '1'
          RXPOS_SHARD: ${{ matrix.shard }}
          RXPOS_TEST_HUB: ${{ matrix.target == 'hub' && '1' || '' }}
        run: node tests/run-all.mjs 2>&1 | tee tests.log
      - name: Keep the log and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-tests-${{ matrix.target }}-${{ strategy.job-index }}
          retention-days: 7
          path: |
            tests.log
            tests/.output/
          if-no-files-found: ignore

  # the one result callers wait for: every group passed, or this code had already passed
  full:
    needs: [check, shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every group passed
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then echo "::error::The check for an earlier pass failed"; exit 1; fi
          if [ "${{ needs.check.outputs.passed }}" = "true" ]; then echo "Already passed: reused."; exit 0; fi
          if [ "${{ needs.shard.result }}" != "success" ]; then echo "::error::A group of suites failed (see the shard jobs and their logs)"; exit 1; fi
      - name: Record the pass for this code
        if: needs.check.outputs.passed != 'true'
        run: echo "${{ needs.check.outputs.tree }} passed at ${{ github.sha }} (${{ github.event_name }})" > passed.txt
      - if: needs.check.outputs.passed != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-tests-passed-${{ needs.check.outputs.tree }}
          retention-days: 30
          path: passed.txt
