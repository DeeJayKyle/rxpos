# Publishes a tested Flutter build as a named release of the new apps, and offers it to the installed apps.
# It takes the files the "Flutter apps" workflow already put on the flutter-pilot pre-release (no rebuild, so the
# release is exactly the build that passed), checks each against the build named below, publishes them under
# RELEASE_TAG, and uploads them as the update the installed apps take (scripts/publish-flutter-update.sh).
# The tag deliberately doesn't start with "v": v* tags are the React app's releases (build.yml).
# Runs when this file changes on the pilot branch, or by hand.
name: Flutter release

on:
  push:
    branches: [ccr-54387795-ifu3p1] # not again when the branch is merged into main
    paths:
      - '.github/workflows/flutter-release.yml'
  workflow_dispatch:
    inputs:
      build:
        description: 'The "Flutter apps" run number to release (a successful run on main)'
        required: true

permissions:
  contents: write
  actions: read # to check the run that built the files

concurrency:
  group: flutter-release
  cancel-in-progress: false

env:
  RELEASE_TAG: flutter-v2.1
  RELEASE_NAME: RxPos Ug v2.1
  BUILD: ${{ inputs.build || '0' }} # the "Flutter apps" run number whose files are released (app version 2.1.BUILD)
  V: '2.1' # the version's first two numbers (flutter-apps.yml's VERSION)
  LATEST: 'true' # the owner made the new apps the repository's latest release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The files of that build, from the pilot release
        run: |
          mkdir -p out
          files="RxPOS.apk RxPOS-arm64.apk RxPOS-armv7.apk RxPOS-x64.apk RxPOS.aab RxPOS-Setup.exe RxPOS-windows-portable.zip"
          for a in $files; do pats+=(--pattern "$a"); done
          gh release download flutter-pilot --repo "$GITHUB_REPOSITORY" --dir out "${pats[@]}"
          ls -l out
          # the pilot release must hold that build: its run finished successfully after these files were uploaded
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/flutter-apps.yml/runs?per_page=50" \
            --jq ".workflow_runs[] | select(.run_number == $BUILD) | [.conclusion, .updated_at, .run_started_at, .head_sha] | @tsv")
          echo "Flutter apps run $BUILD: $run"
          [ "$(cut -f1 <<<"$run")" = success ] || { echo "::error::Flutter apps run $BUILD has not finished successfully: nothing was released."; exit 1; }
          echo "SHA=$(cut -f4 <<<"$run")" >> "$GITHUB_ENV" # the release names the commit that was built
          for a in $files; do
            up=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/flutter-pilot" --jq ".assets[] | select(.name == \"$a\") | .updated_at")
            echo "$a uploaded $up"
            [[ "$up" < "$(cut -f2 <<<"$run")" ]] || { echo "::error::$a on flutter-pilot is newer than run $BUILD: a later build replaced it."; exit 1; }
            [[ "$up" > "$(cut -f3 <<<"$run")" ]] || { echo "::error::$a on flutter-pilot is older than run $BUILD: that run did not upload it."; exit 1; }
          done
          v="$V.$BUILD"
          cp out/RxPOS.apk "out/RxPOS-$v.apk"
          for abi in arm64 armv7 x64; do cp "out/RxPOS-$abi.apk" "out/RxPOS-$v-$abi.apk"; done
          cp out/RxPOS.aab "out/RxPOS-$v.aab"
          cp out/RxPOS-Setup.exe "out/RxPOS-$v-Setup.exe"
          cp out/RxPOS-windows-portable.zip "out/RxPOS-$v-windows-portable.zip"
          (cd out && sha256sum RxPOS-$V.* > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # the tag goes on main: GitHub refuses this token a tag on a pilot commit whose workflow files differ from
          # main's. The files are exactly the build named below (its commit is in the notes).
          target_commitish: main
          name: ${{ env.RELEASE_NAME }}
          prerelease: false
          make_latest: ${{ env.LATEST }}
          body: |
            RxPOS ${{ env.V }} for Windows and Android (version ${{ env.V }}.${{ env.BUILD }}), built with Flutter. It
            uses the same pharmacy account and cloud as the classic app 1.8, so both can be used side by side. Installed
            copies of 2.0 update to it by themselves. Deploy the cloud first: insurance, day closing and field-by-field
            merging need it. Full notes: docs/RELEASE-NOTES.md.

            **New in 2.1**
            - **Insurance:** insurers and schemes; the client pays the co-pay and the insurer owes the rest.
            - **GS1 pack barcodes** fill the medicine, batch and expiry at Add Stock and sell from that batch at the till.
            - **Add Stock:** an invoice no longer changes the retail price; any expiry format is read; any line can be
              received by the pack and sold by the tablet.
            - **Discount limit per role, blind cash-up, credit-limit reasons, close the day** per branch.
            - **Keyboard, mouse and navigation:** shortcuts on every page (changeable per device), arrow keys and
              right-click menus in lists, ticking with Shift+click and actions for all ticked rows, breadcrumbs.
            - **Accessibility** checked with Flutter's own guidelines in light and dark, and fixed.

            **Which file to take**
            - **Windows:** `RxPOS-${{ env.V }}.${{ env.BUILD }}-Setup.exe`, or the portable zip.
            - **Android, most phones:** `RxPOS-${{ env.V }}.${{ env.BUILD }}-arm64.apk`. Older 32-bit phones: `-armv7.apk`;
              emulators and Chromebooks: `-x64.apk`. Not sure? `RxPOS-${{ env.V }}.${{ env.BUILD }}.apk` works on every phone.
            - `RxPOS-${{ env.V }}.${{ env.BUILD }}.aab` is the bundle for Google Play (not for installing directly).
            - Checksums are in `SHA256SUMS.txt`. Built from commit ${{ env.SHA }} ("Flutter apps" run ${{ env.BUILD }}).
          files: |
            out/RxPOS-${{ env.V }}.${{ env.BUILD }}.apk
            out/RxPOS-${{ env.V }}.${{ env.BUILD }}-arm64.apk
            out/RxPOS-${{ env.V }}.${{ env.BUILD }}-armv7.apk
            out/RxPOS-${{ env.V }}.${{ env.BUILD }}-x64.apk
            out/RxPOS-${{ env.V }}.${{ env.BUILD }}.aab
            out/RxPOS-${{ env.V }}.${{ env.BUILD }}-Setup.exe
            out/RxPOS-${{ env.V }}.${{ env.BUILD }}-windows-portable.zip
            out/SHA256SUMS.txt
          fail_on_unmatched_files: true
      - name: Offer it to the installed apps
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          scripts/publish-flutter-update.sh android out/RxPOS.apk "$BUILD" "$V.$BUILD"
          for abi in arm64 armv7 x64; do scripts/publish-flutter-update.sh "android-$abi" "out/RxPOS-$abi.apk" "$BUILD" "$V.$BUILD"; done
          scripts/publish-flutter-update.sh windows out/RxPOS-Setup.exe "$BUILD" "$V.$BUILD"
