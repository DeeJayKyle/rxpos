name: Build RxPOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Optional: add repo secrets WINDOWS_CERT_B64 (.pfx as base64) + WINDOWS_CERT_PASSWORD to sign the installer
      - name: Code-signing certificate (only when configured)
        shell: bash
        env:
          CERT: ${{ secrets.WINDOWS_CERT_B64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -n "$CERT" ]; then
            echo "CSC_LINK=$CERT" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CERT_PASS" >> "$GITHUB_ENV"
          fi
      - run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RxPOS-Windows
          path: |
            release/*.exe
          if-no-files-found: error
      - name: Publish GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package web app + hub
        run: |
          mkdir -p out/rxpos-hub
          cp -r dist server package.json out/rxpos-hub/
          cd out && zip -r RxPOS-Hub.zip rxpos-hub
      - uses: actions/upload-artifact@v4
        with:
          name: RxPOS-Hub
          path: out/RxPOS-Hub.zip
      - name: Attach to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/RxPOS-Hub.zip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hub image
        run: docker build -t rxpos-hub .
      - name: Smoke test
        run: |
          docker run -d --name hub -e RXPOS_SYNC_KEY=ci-smoke-test-key -p 8686:8686 rxpos-hub
          for i in $(seq 1 20); do curl -fs http://localhost:8686/api/health && break; sleep 1; done
          curl -fs http://localhost:8686/ | grep -q RxPOS
          curl -fs -X POST http://localhost:8686/api/sync -H 'Authorization: Bearer ci-smoke-test-key' -H 'Content-Type: application/json' \
            -d '{"deviceId":"ci","since":0,"changes":[{"t":"products","id":"x","rec":{"id":"x"},"at":"2026-01-01T00:00:00.000Z"}]}' | grep -q '"applied":1'
          docker logs hub

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - name: Create Android project
        run: |
          rm -rf dist/updates   # the update archive is for devices already installed, not inside the APK
          npx cap add android
          npx cap sync android
          # The self-update plugin asks for WorkManager 2.10, which needs Android API 35 to compile; 2.9 has every
          # class it uses and builds with Capacitor 6 (compileSdk 34)
          printf '\nallprojects { configurations.all { resolutionStrategy { force "androidx.work:work-runtime:2.9.1" } } }\n' >> android/build.gradle
          tail -2 android/build.gradle
          # …and needs Android 6.0 (API 23) or newer (Capacitor 6 alone allows 5.1)
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
          grep -n minSdkVersion android/variables.gradle
      - name: Android permissions (camera for prescriptions, microphone for calls & voice notes, location for weather)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in CAMERA RECORD_AUDIO MODIFY_AUDIO_SETTINGS ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION POST_NOTIFICATIONS; do
            grep -q "android.permission.$p\"" $M || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$p\" />\n</manifest>#" $M
          done
          grep -q 'android.hardware.camera"' $M || sed -i 's#</manifest>#    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $M
          grep uses-permission $M
      - name: App icon
        run: |
          command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=${d%%:*}; size=${d##*:}
            convert build/icon.png -resize ${size}x${size} $RES/mipmap-$dir/ic_launcher.png
            cp $RES/mipmap-$dir/ic_launcher.png $RES/mipmap-$dir/ic_launcher_round.png
          done
      - name: Version number
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
      - name: Build signed APK (install directly) and AAB (Google Play)
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          if [ -z "$KS_B64" ]; then
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../RxPOS-Android.apk
            exit 0
          fi
          printf '%s' "$KS_B64" | tr -d '\r\n ' | base64 -d > release.jks
          KS_PASS=$(printf '%s' "$KS_PASS" | tr -d '\r\n'); KS_ALIAS=$(printf '%s' "$KS_ALIAS" | tr -d '\r\n'); export KS_PASS KS_ALIAS
          ./gradlew assembleRelease bundleRelease --no-daemon
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" --out ../RxPOS-Android.apk aligned.apk
          $BT/apksigner verify ../RxPOS-Android.apk
          cp app/build/outputs/bundle/release/app-release.aab ../RxPOS-GooglePlay.aab
          jarsigner -keystore release.jks -storepass "$KS_PASS" -keypass "$KS_PASS" ../RxPOS-GooglePlay.aab "$KS_ALIAS"
          rm release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: RxPOS-Android
          path: |
            RxPOS-Android.apk
            RxPOS-GooglePlay.aab
          if-no-files-found: warn
      - name: Attach to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RxPOS-Android.apk
            RxPOS-GooglePlay.aab
