name: Build PharmaPOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PharmaPOS-Windows
          path: |
            release/*.exe
          if-no-files-found: error
      - name: Publish GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package web app + hub
        run: |
          mkdir -p out/pharmapos-hub
          cp -r dist server package.json out/pharmapos-hub/
          cd out && zip -r PharmaPOS-Hub.zip pharmapos-hub
      - uses: actions/upload-artifact@v4
        with:
          name: PharmaPOS-Hub
          path: out/PharmaPOS-Hub.zip
      - name: Attach to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/PharmaPOS-Hub.zip
