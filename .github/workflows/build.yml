name: Build RxPOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release with this tag (e.g. v1.0.1); blank = just build'
        required: false
        default: ''
      deploy:
        description: 'Put the website (rxposug.com) and the cloud (api.rxposug.com) live: with the release, now (no release), or no'
        type: choice
        options: ['with release', 'now', 'no']
        default: 'with release'

permissions:
  contents: read

jobs:
  # Fast, browser-free checks on every push and pull request (review Phase 1.8).
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 2026-11-17 audit
          fetch-depth: 0 # the classic app's build number is its last change (scripts/release-files.mjs)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # node:sqlite (tests/unit-window-incremental.mjs)
          cache: npm
      - run: npm ci
      - name: Lint (ESLint, eslint.config.js)
        run: npm run lint
      - name: Unit tests
        run: for f in tests/unit-*.mjs; do echo "== $f =="; node "$f" || exit 1; done
      - name: Type check (storage and sync contracts)
        run: npm run typecheck
      - name: App builds
        run: npm run build

  # Every suite against a local cloud in headless Chrome (full-tests.yml). Releases and deploys wait for it.
  # Code that already passed (e.g. in its pull request) is not tested again; otherwise the groups run side by side.
  full:
    uses: ./.github/workflows/full-tests.yml
    permissions:
      contents: read
      actions: read

  windows:
    runs-on: windows-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'build' }} # 2026-11-17 audit: secrets only on main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 2026-11-17 audit
          fetch-depth: 0 # the classic app's build number is its last change (scripts/release-files.mjs)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Code signing (MAINTENANCE.md "Signing the Windows app"): with neither option configured, the build is unsigned.
      # * SSL.com eSigner (cloud OV certificate, secrets ESIGNER_USERNAME, ESIGNER_PASSWORD, ESIGNER_CREDENTIAL_ID,
      #   ESIGNER_TOTP_SECRET): release runs only, because each signing is paid for (about 4 files per release).
      # * A .pfx file (WINDOWS_CERT_B64 as base64 + WINDOWS_CERT_PASSWORD): every build, as before.
      - name: Code signing (only when configured)
        id: signing
        shell: bash
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '') }}
          ES_USER: ${{ secrets.ESIGNER_USERNAME }}
          ES_PASS: ${{ secrets.ESIGNER_PASSWORD }}
          ES_CRED: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ES_TOTP: ${{ secrets.ESIGNER_TOTP_SECRET }}
          CERT: ${{ secrets.WINDOWS_CERT_B64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -n "$ES_USER" ] && [ -n "$ES_PASS" ] && [ -n "$ES_CRED" ] && [ -n "$ES_TOTP" ]; then
            if [ "$RELEASE" = "true" ]; then echo "mode=esigner" >> "$GITHUB_OUTPUT"; echo "Signing with SSL.com eSigner (release run)"
            else echo "mode=none" >> "$GITHUB_OUTPUT"; echo "eSigner is set up; this is not a release run, so nothing is signed (saves paid signings)"; fi
          elif [ -n "$ES_USER$ES_PASS$ES_CRED$ES_TOTP" ]; then
            echo "::error::Only some of ESIGNER_USERNAME, ESIGNER_PASSWORD, ESIGNER_CREDENTIAL_ID, ESIGNER_TOTP_SECRET are set. Add all four or remove them."
            exit 1
          elif [ -n "$CERT" ]; then
            echo "CSC_LINK=$CERT" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CERT_PASS" >> "$GITHUB_ENV"
            echo "mode=pfx" >> "$GITHUB_OUTPUT"; echo "Signing with the .pfx certificate"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"; echo "No code-signing secrets: building unsigned"
          fi
      - name: Set up SSL.com CodeSignTool
        if: steps.signing.outputs.mode == 'esigner'
        shell: pwsh
        env:
          TOOL_SHA256: ${{ vars.CODESIGNTOOL_SHA256 }} # optional pin: the hash this step prints on the first signed release
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'CodeSignTool.zip'
          Invoke-WebRequest -Uri 'https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.0/CodeSignTool-v1.3.0-windows.zip' -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "CodeSignTool-v1.3.0-windows.zip SHA-256: $hash"
          if ($env:TOOL_SHA256 -and $hash -ne $env:TOOL_SHA256.ToLower()) { Write-Host "::error::CodeSignTool download does not match the CODESIGNTOOL_SHA256 variable"; exit 1 }
          $dest = Join-Path $env:RUNNER_TEMP 'codesigntool'
          Expand-Archive $zip -DestinationPath $dest -Force
          $dir = (Get-ChildItem $dest -Recurse -Directory -Filter jar | Select-Object -First 1).Parent.FullName
          if (-not $dir) { Write-Host "::error::CodeSignTool jar folder not found"; exit 1 }
          # SSL.com's production settings (the same file their esigner-codesign action writes)
          New-Item -ItemType Directory -Force (Join-Path $dir 'conf') | Out-Null
          Set-Content (Join-Path $dir 'conf/code_sign_tool.properties') -Encoding ascii -Value @(
            'CLIENT_ID=kaXTRACNijSWsFdRKg_KAfD3fqrBlzMbWs6TwWHwAn8',
            'OAUTH2_ENDPOINT=https://login.ssl.com/oauth2/token',
            'CSC_API_ENDPOINT=https://cs.ssl.com',
            'TSA_URL=http://ts.ssl.com',
            'TSA_LEGACY_URL=http://ts.ssl.com/legacy')
          $java = if ($env:JAVA_HOME_17_X64) { $env:JAVA_HOME_17_X64 } elseif ($env:JAVA_HOME_21_X64) { $env:JAVA_HOME_21_X64 } else { $env:JAVA_HOME }
          "CODESIGNTOOL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "JAVA_HOME=$java" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the installer
        shell: bash
        env:
          MODE: ${{ steps.signing.outputs.mode }}
          ESIGNER_USERNAME: ${{ steps.signing.outputs.mode == 'esigner' && secrets.ESIGNER_USERNAME || '' }}
          ESIGNER_PASSWORD: ${{ steps.signing.outputs.mode == 'esigner' && secrets.ESIGNER_PASSWORD || '' }}
          ESIGNER_CREDENTIAL_ID: ${{ steps.signing.outputs.mode == 'esigner' && secrets.ESIGNER_CREDENTIAL_ID || '' }}
          ESIGNER_TOTP_SECRET: ${{ steps.signing.outputs.mode == 'esigner' && secrets.ESIGNER_TOTP_SECRET || '' }}
        run: |
          if [ "$MODE" = "esigner" ]; then
            # one sha256 signature per file (each eSigner signing is paid for); scripts/win-sign.cjs fails the build on any error
            npm run dist:win -- -c.win.sign=./scripts/win-sign.cjs -c.win.signingHashAlgorithms=sha256
          else
            npm run dist:win
          fi
      - name: Every installer is signed
        if: steps.signing.outputs.mode != 'none'
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem release/*.exe, release/win-unpacked/RxPOS.exe) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { $bad++ }
          }
          if ($bad) { Write-Host "::error::$bad file(s) are not validly signed"; exit 1 }
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RxPOS-Windows
          retention-days: 3 # releases carry the shipped files; these per-build copies only need a few days
          path: |
            release/*.exe
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 2026-11-17 audit
          fetch-depth: 0 # the classic app's build number is its last change (scripts/release-files.mjs)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package web app + hub
        run: |
          mkdir -p out/rxpos-hub
          cp -r dist server package.json out/rxpos-hub/
          cd out && zip -r RxPOS-Hub.zip rxpos-hub
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RxPOS-Hub
          retention-days: 3 # releases carry the shipped files; these per-build copies only need a few days
          path: out/RxPOS-Hub.zip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 2026-11-17 audit
          fetch-depth: 0 # the classic app's build number is its last change (scripts/release-files.mjs)
      - name: Build hub image
        run: docker build -t rxpos-hub .
      - name: Smoke test
        run: |
          docker run -d --name hub -e RXPOS_SYNC_KEY=ci-smoke-test-key -p 8686:8686 rxpos-hub
          for i in $(seq 1 20); do curl -fs http://localhost:8686/api/health && break; sleep 1; done
          curl -fs http://localhost:8686/ | grep -q RxPOS
          curl -fs -X POST http://localhost:8686/api/sync -H 'Authorization: Bearer ci-smoke-test-key' -H 'Content-Type: application/json' \
            -d '{"deviceId":"ci","since":0,"changes":[{"t":"products","id":"x","rec":{"id":"x"},"at":"2026-01-01T00:00:00.000Z"}]}' | grep -q '"applied":1'
          docker logs hub

  android:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'build' }} # 2026-11-17 audit: secrets only on main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 2026-11-17 audit
          fetch-depth: 0 # the classic app's build number is its last change (scripts/release-files.mjs)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - name: Create Android project
        run: |
          rm -rf dist/updates   # the update archive is for devices already installed, not inside the APK
          npx cap add android
          npx cap sync android
          # The self-update plugin asks for WorkManager 2.10, which needs Android API 35 to compile; 2.9 has every
          # class it uses and builds with Capacitor 6 (compileSdk 34)
          printf '\nallprojects { configurations.all { resolutionStrategy { force "androidx.work:work-runtime:2.9.1" } } }\n' >> android/build.gradle
          tail -2 android/build.gradle
          # …and needs Android 6.0 (API 23) or newer (Capacitor 6 alone allows 5.1)
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
          grep -n minSdkVersion android/variables.gradle
      - name: Android permissions (camera for prescriptions, microphone for calls & voice notes, location for weather)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in CAMERA RECORD_AUDIO MODIFY_AUDIO_SETTINGS ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION POST_NOTIFICATIONS; do
            grep -q "android.permission.$p\"" $M || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$p\" />\n</manifest>#" $M
          done
          grep -q 'android.hardware.camera"' $M || sed -i 's#</manifest>#    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $M
          grep uses-permission $M
          # 2026-11-26 (on-device data security): the pharmacy and its key never leave the phone in a backup
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' $M
          grep -q 'android:allowBackup="false"' $M || sed -i 's#<application#<application android:allowBackup="false"#' $M
          grep -n allowBackup $M
      - name: Screen rotation, pinch zoom and desktop view (This device page)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          # follow the phone's own auto-rotate switch, all four directions; RxPOS can lock it from This device
          grep -q 'screenOrientation' $M || sed -i 's#<activity#<activity android:screenOrientation="fullUser"#' $M
          grep -n 'screenOrientation' $M
          A=$(find android/app/src/main/java -name MainActivity.java)
          PKG=$(sed -n 's/^package \(.*\);/\1/p' $A)
          cat > $A <<JAVA
          package $PKG;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebSettings s = getBridge().getWebView().getSettings();
                  s.setSupportZoom(true);            // pinch to zoom
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);   // no +/- buttons on screen
                  s.setUseWideViewPort(true);        // lets "Desktop view" lay the page out at PC width
                  s.setLoadWithOverviewMode(true);
              }
          }
          JAVA
          cat $A
      - name: App icon
        run: |
          command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=${d%%:*}; size=${d##*:}
            convert build/icon.png -resize ${size}x${size} $RES/mipmap-$dir/ic_launcher.png
            cp $RES/mipmap-$dir/ic_launcher.png $RES/mipmap-$dir/ic_launcher_round.png
          done
      - name: Version number
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
      - name: Build signed APK (install directly) and AAB (Google Play)
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '') }}
        run: |
          chmod +x gradlew
          if [ -z "$KS_B64" ]; then
            if [ "$RELEASE" = "true" ]; then
              echo "::error::Release build but Android signing secrets are missing (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS). Refusing to ship an unsigned debug APK."
              exit 1
            fi
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../RxPOS-Android.apk
            exit 0
          fi
          printf '%s' "$KS_B64" | tr -d '\r\n ' | base64 -d > release.jks
          KS_PASS=$(printf '%s' "$KS_PASS" | tr -d '\r\n'); KS_ALIAS=$(printf '%s' "$KS_ALIAS" | tr -d '\r\n'); export KS_PASS KS_ALIAS
          ./gradlew assembleRelease bundleRelease --no-daemon
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" --out ../RxPOS-Android.apk aligned.apk
          $BT/apksigner verify ../RxPOS-Android.apk
          cp app/build/outputs/bundle/release/app-release.aab ../RxPOS-GooglePlay.aab
          jarsigner -keystore release.jks -storepass "$KS_PASS" -keypass "$KS_PASS" ../RxPOS-GooglePlay.aab "$KS_ALIAS"
          rm release.jks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RxPOS-Android
          retention-days: 3 # releases carry the shipped files; these per-build copies only need a few days
          path: |
            RxPOS-Android.apk
            RxPOS-GooglePlay.aab
          if-no-files-found: warn

  # One release with everything, after all builds: on a version tag push, or a manual run with "release" filled in
  # (the workflow then creates the tag itself at this commit)
  release:
    needs: [unit, full, windows, web, android]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: RxPOS-* # the apps only, not the test logs and screenshots
      - run: ls -R artifacts
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: RxPOS ${{ github.event_name == 'workflow_dispatch' && inputs.release || github.ref_name }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true # re-publishing an existing tag (e.g. v1.0.0) replaces its downloads
          files: |
            artifacts/RxPOS-Windows/*.exe
            artifacts/RxPOS-Hub/RxPOS-Hub.zip
            artifacts/RxPOS-Android/*

  # Put this build live (1.7): the cloud Worker (api.rxposug.com) first, it accepts older apps, then the website
  # (Cloudflare Pages project "rxpos", rxposug.com), then check both answer with this version. Runs after a successful
  # release, or on its own with deploy = now. Needs the repository secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare
  # Workers" template plus Pages Edit and D1 Edit) and CLOUDFLARE_ACCOUNT_ID: MAINTENANCE.md section 5. Rolling back:
  # Cloudflare dashboard → Deployments.
  deploy:
    needs: [unit, full, release]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && needs.unit.result == 'success' && needs.full.result == 'success' &&
      ((inputs.deploy == 'with release' && inputs.release != '' && needs.release.result == 'success') || inputs.deploy == 'now')
    runs-on: ubuntu-latest
    environment: production # 2026-11-17 audit: the Cloudflare token only on the protected environment
    concurrency: production-deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare secrets present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (GitHub → Settings → Secrets and variables → Actions). Nothing was deployed."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 2026-11-17 audit
          fetch-depth: 0 # the classic app's build number is its last change (scripts/release-files.mjs)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # wrangler needs Node 22+
          cache: npm
      - run: npm ci
      - name: Build the app (the website and the Worker serve the same files)
        run: npm run build
      - name: The new apps' update bucket exists (the Worker's APPS binding needs it)
        run: npx wrangler r2 bucket info rxpos-apps > /dev/null 2>&1 || npx wrangler r2 bucket create rxpos-apps
      - name: Deploy the cloud (Worker pharmapos → api.rxposug.com)
        run: npx wrangler deploy
      - name: Deploy the website (Pages project rxpos → rxposug.com)
        # with the newest tested RxPOS app for the browser (the site's home page), so this deploy never takes it away
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/site-with-app.sh dist site
          npx wrangler pages deploy site --project-name rxpos --branch main --commit-dirty=true
      - name: Cloudflare forgets its old copies of the website (no location keeps a wrong update file)
        run: node scripts/purge-site-cache.mjs rxposug.com
      - name: Check both are live with this version
        run: |
          WANT=$(node -p "require('./dist/version.json').build")
          for i in $(seq 1 20); do
            GOT=$(curl -fsS "https://rxposug.com/version.json?t=$(date +%s)" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).build)}catch{console.log('not-json')}})" || echo none)
            API=$(curl -fsS "https://api.rxposug.com/api/version?t=$(date +%s)" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).build)}catch{console.log('not-json')}})" || echo none)
            echo "website: $GOT  cloud: $API  wanted: $WANT"
            if [ "$GOT" = "$WANT" ] && [ "$API" = "$WANT" ]; then
              HEALTH=$(curl -fsS https://api.rxposug.com/api/health || echo '{}'); echo "$HEALTH"
              # sign-in must work too: the cloud reports whether it can sign passes (TOKEN_SECRET set and long enough)
              if echo "$HEALTH" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const h=JSON.parse(s||'{}');process.exit(h.ok&&h.signing!==false?0:1)})"; then exit 0; fi
              echo "::error::The cloud is live but cannot sign anyone in (Worker secret TOKEN_SECRET missing or under 32 characters). Add it in Cloudflare → pharmapos → Settings → Variables and Secrets, or roll back the Worker."
              exit 1
            fi
            sleep 15
          done
          echo "::error::The website or the cloud does not answer with build $WANT yet. Check Cloudflare → Workers & Pages → Deployments."
          exit 1
      - name: Every update file arrives exactly as listed (the Windows app refuses a changed file)
        run: |
          for i in 1 2 3 4; do code=0; node scripts/check-update-files.mjs || code=$?; [ $code = 0 ] && exit 0; sleep 30; done # (|| keeps bash -e from stopping at the first try)
          if [ $code = 2 ]; then echo "::error::rxposug.com could not be reached from the build machine, so the update files were not checked (the deploy itself finished). Run the Cloud logs workflow to check them."; else echo "::error::Files on rxposug.com differ from version.json: installed apps cannot update. See the lines above."; fi
          exit 1
