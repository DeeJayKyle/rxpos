name: Build RxPOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release with this tag (e.g. v1.0.1); blank = just build'
        required: false
        default: ''
      deploy:
        description: 'Put the website (rxposug.com) and the cloud (api.rxposug.com) live: with the release, now (no release), or no'
        type: choice
        options: ['with release', 'now', 'no']
        default: 'with release'

permissions:
  contents: read

jobs:
  # Fast, browser-free checks on every push and pull request (review Phase 1.8). The full browser/cloud suite
  # (puppeteer + wrangler + xvfb Electron) is heavier to wire into CI and is tracked as a follow-up.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: for f in tests/unit-*.mjs; do echo "== $f =="; node "$f" || exit 1; done
      - name: Type check (storage and sync contracts)
        run: npm run typecheck
      - name: App builds
        run: npm run build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Optional: add repo secrets WINDOWS_CERT_B64 (.pfx as base64) + WINDOWS_CERT_PASSWORD to sign the installer
      - name: Code-signing certificate (only when configured)
        shell: bash
        env:
          CERT: ${{ secrets.WINDOWS_CERT_B64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -n "$CERT" ]; then
            echo "CSC_LINK=$CERT" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CERT_PASS" >> "$GITHUB_ENV"
          fi
      - run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RxPOS-Windows
          retention-days: 3 # releases carry the shipped files; these per-build copies only need a few days
          path: |
            release/*.exe
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package web app + hub
        run: |
          mkdir -p out/rxpos-hub
          cp -r dist server package.json out/rxpos-hub/
          cd out && zip -r RxPOS-Hub.zip rxpos-hub
      - uses: actions/upload-artifact@v4
        with:
          name: RxPOS-Hub
          retention-days: 3 # releases carry the shipped files; these per-build copies only need a few days
          path: out/RxPOS-Hub.zip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hub image
        run: docker build -t rxpos-hub .
      - name: Smoke test
        run: |
          docker run -d --name hub -e RXPOS_SYNC_KEY=ci-smoke-test-key -p 8686:8686 rxpos-hub
          for i in $(seq 1 20); do curl -fs http://localhost:8686/api/health && break; sleep 1; done
          curl -fs http://localhost:8686/ | grep -q RxPOS
          curl -fs -X POST http://localhost:8686/api/sync -H 'Authorization: Bearer ci-smoke-test-key' -H 'Content-Type: application/json' \
            -d '{"deviceId":"ci","since":0,"changes":[{"t":"products","id":"x","rec":{"id":"x"},"at":"2026-01-01T00:00:00.000Z"}]}' | grep -q '"applied":1'
          docker logs hub

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - name: Create Android project
        run: |
          rm -rf dist/updates   # the update archive is for devices already installed, not inside the APK
          npx cap add android
          npx cap sync android
          # The self-update plugin asks for WorkManager 2.10, which needs Android API 35 to compile; 2.9 has every
          # class it uses and builds with Capacitor 6 (compileSdk 34)
          printf '\nallprojects { configurations.all { resolutionStrategy { force "androidx.work:work-runtime:2.9.1" } } }\n' >> android/build.gradle
          tail -2 android/build.gradle
          # …and needs Android 6.0 (API 23) or newer (Capacitor 6 alone allows 5.1)
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
          grep -n minSdkVersion android/variables.gradle
      - name: Android permissions (camera for prescriptions, microphone for calls & voice notes, location for weather)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in CAMERA RECORD_AUDIO MODIFY_AUDIO_SETTINGS ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION POST_NOTIFICATIONS; do
            grep -q "android.permission.$p\"" $M || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$p\" />\n</manifest>#" $M
          done
          grep -q 'android.hardware.camera"' $M || sed -i 's#</manifest>#    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $M
          grep uses-permission $M
      - name: Screen rotation, pinch zoom and desktop view (This device page)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          # follow the phone's own auto-rotate switch, all four directions; RxPOS can lock it from This device
          grep -q 'screenOrientation' $M || sed -i 's#<activity#<activity android:screenOrientation="fullUser"#' $M
          grep -n 'screenOrientation' $M
          A=$(find android/app/src/main/java -name MainActivity.java)
          PKG=$(sed -n 's/^package \(.*\);/\1/p' $A)
          cat > $A <<JAVA
          package $PKG;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebSettings s = getBridge().getWebView().getSettings();
                  s.setSupportZoom(true);            // pinch to zoom
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);   // no +/- buttons on screen
                  s.setUseWideViewPort(true);        // lets "Desktop view" lay the page out at PC width
                  s.setLoadWithOverviewMode(true);
              }
          }
          JAVA
          cat $A
      - name: App icon
        run: |
          command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=${d%%:*}; size=${d##*:}
            convert build/icon.png -resize ${size}x${size} $RES/mipmap-$dir/ic_launcher.png
            cp $RES/mipmap-$dir/ic_launcher.png $RES/mipmap-$dir/ic_launcher_round.png
          done
      - name: Version number
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
      - name: Build signed APK (install directly) and AAB (Google Play)
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '') }}
        run: |
          chmod +x gradlew
          if [ -z "$KS_B64" ]; then
            if [ "$RELEASE" = "true" ]; then
              echo "::error::Release build but Android signing secrets are missing (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS). Refusing to ship an unsigned debug APK."
              exit 1
            fi
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../RxPOS-Android.apk
            exit 0
          fi
          printf '%s' "$KS_B64" | tr -d '\r\n ' | base64 -d > release.jks
          KS_PASS=$(printf '%s' "$KS_PASS" | tr -d '\r\n'); KS_ALIAS=$(printf '%s' "$KS_ALIAS" | tr -d '\r\n'); export KS_PASS KS_ALIAS
          ./gradlew assembleRelease bundleRelease --no-daemon
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" --out ../RxPOS-Android.apk aligned.apk
          $BT/apksigner verify ../RxPOS-Android.apk
          cp app/build/outputs/bundle/release/app-release.aab ../RxPOS-GooglePlay.aab
          jarsigner -keystore release.jks -storepass "$KS_PASS" -keypass "$KS_PASS" ../RxPOS-GooglePlay.aab "$KS_ALIAS"
          rm release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: RxPOS-Android
          retention-days: 3 # releases carry the shipped files; these per-build copies only need a few days
          path: |
            RxPOS-Android.apk
            RxPOS-GooglePlay.aab
          if-no-files-found: warn

  # One release with everything, after all builds: on a version tag push, or a manual run with "release" filled in
  # (the workflow then creates the tag itself at this commit)
  release:
    needs: [unit, windows, web, android]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: ls -R artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: RxPOS ${{ github.event_name == 'workflow_dispatch' && inputs.release || github.ref_name }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true # re-publishing an existing tag (e.g. v1.0.0) replaces its downloads
          files: |
            artifacts/RxPOS-Windows/*.exe
            artifacts/RxPOS-Hub/RxPOS-Hub.zip
            artifacts/RxPOS-Android/*

  # Put this build live (1.7): the cloud Worker (api.rxposug.com) first, it accepts older apps, then the website
  # (Cloudflare Pages project "rxpos", rxposug.com), then check both answer with this version. Runs after a successful
  # release, or on its own with deploy = now. Needs the repository secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare
  # Workers" template plus Pages Edit and D1 Edit) and CLOUDFLARE_ACCOUNT_ID: MAINTENANCE.md section 5. Rolling back:
  # Cloudflare dashboard → Deployments.
  deploy:
    needs: [unit, release]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && needs.unit.result == 'success' &&
      ((inputs.deploy == 'with release' && inputs.release != '' && needs.release.result == 'success') || inputs.deploy == 'now')
    runs-on: ubuntu-latest
    concurrency: production-deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare secrets present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (GitHub → Settings → Secrets and variables → Actions). Nothing was deployed."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # wrangler needs Node 22+
          cache: npm
      - run: npm ci
      - name: Build the app (the website and the Worker serve the same files)
        run: npm run build
      - name: Deploy the cloud (Worker pharmapos → api.rxposug.com)
        run: npx wrangler deploy
      - name: Deploy the website (Pages project rxpos → rxposug.com)
        run: npx wrangler pages deploy dist --project-name rxpos --branch main --commit-dirty=true
      - name: Check both are live with this version
        run: |
          WANT=$(node -p "require('./dist/version.json').build")
          for i in $(seq 1 20); do
            GOT=$(curl -fsS "https://rxposug.com/version.json?t=$(date +%s)" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).build)}catch{console.log('not-json')}})" || echo none)
            API=$(curl -fsS "https://api.rxposug.com/api/version?t=$(date +%s)" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).build)}catch{console.log('not-json')}})" || echo none)
            echo "website: $GOT  cloud: $API  wanted: $WANT"
            if [ "$GOT" = "$WANT" ] && [ "$API" = "$WANT" ]; then
              HEALTH=$(curl -fsS https://api.rxposug.com/api/health || echo '{}'); echo "$HEALTH"
              # sign-in must work too: the cloud reports whether it can sign passes (TOKEN_SECRET set and long enough)
              if echo "$HEALTH" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const h=JSON.parse(s||'{}');process.exit(h.ok&&h.signing!==false?0:1)})"; then exit 0; fi
              echo "::error::The cloud is live but cannot sign anyone in (Worker secret TOKEN_SECRET missing or under 32 characters). Add it in Cloudflare → pharmapos → Settings → Variables and Secrets, or roll back the Worker."
              exit 1
            fi
            sleep 15
          done
          echo "::error::The website or the cloud does not answer with build $WANT yet. Check Cloudflare → Workers & Pages → Deployments."
          exit 1
      - name: Every update file arrives exactly as listed (the Windows app refuses a changed file)
        run: |
          for i in 1 2 3 4; do code=0; node scripts/check-update-files.mjs || code=$?; [ $code = 0 ] && exit 0; sleep 30; done # (|| keeps bash -e from stopping at the first try)
          if [ $code = 2 ]; then echo "::error::rxposug.com could not be reached from the build machine, so the update files were not checked (the deploy itself finished). Run the Cloud logs workflow to check them."; else echo "::error::Files on rxposug.com differ from version.json: installed apps cannot update. See the lines above."; fi
          exit 1
