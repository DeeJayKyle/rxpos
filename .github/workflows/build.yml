name: Build PharmaPOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PharmaPOS-Windows
          path: |
            release/*.exe
          if-no-files-found: error
      - name: Publish GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package web app + hub
        run: |
          mkdir -p out/pharmapos-hub
          cp -r dist server package.json out/pharmapos-hub/
          cd out && zip -r PharmaPOS-Hub.zip pharmapos-hub
      - uses: actions/upload-artifact@v4
        with:
          name: PharmaPOS-Hub
          path: out/PharmaPOS-Hub.zip
      - name: Attach to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/PharmaPOS-Hub.zip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hub image
        run: docker build -t pharmapos-hub .
      - name: Smoke test
        run: |
          docker run -d --name hub -e PHARMAPOS_SYNC_KEY=ci-smoke-test-key -p 8686:8686 pharmapos-hub
          for i in $(seq 1 20); do curl -fs http://localhost:8686/api/health && break; sleep 1; done
          curl -fs http://localhost:8686/ | grep -q PharmaPOS
          curl -fs -X POST http://localhost:8686/api/sync -H 'Authorization: Bearer ci-smoke-test-key' -H 'Content-Type: application/json' \
            -d '{"deviceId":"ci","since":0,"changes":[{"t":"products","id":"x","rec":{"id":"x"},"at":"2026-01-01T00:00:00.000Z"}]}' | grep -q '"applied":1'
          docker logs hub

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: App icon
        run: |
          command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=${d%%:*}; size=${d##*:}
            convert build/icon.png -resize ${size}x${size} $RES/mipmap-$dir/ic_launcher.png
            cp $RES/mipmap-$dir/ic_launcher.png $RES/mipmap-$dir/ic_launcher_round.png
          done
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../PharmaPOS-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PharmaPOS-Android
          path: PharmaPOS-Android.apk
      - name: Attach to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PharmaPOS-Android.apk
