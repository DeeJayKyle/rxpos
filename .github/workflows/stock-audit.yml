name: Stock audit

# Read-only check of each pharmacy's stock records (tools/stock-audit.mjs): receipts vs stock taken out, purchases vs
# stock added, duplicated changes, counts/edits made on a device missing earlier changes, negative / hidden stock, and a
# day-by-day reconciliation of opening − closing stock value with the cost of sales. It changes nothing and prints stock
# figures only (receipt numbers, medicines, quantities, values) — never customer details.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of daily reconciliation to show'
        default: '30'
      pharmacies:
        description: 'Pharmacy web addresses to audit, space-separated (empty = all)'
        default: ''
      restore_costs_at:
        description: 'Put back the costs one save changed: its UTC second, e.g. 2026-11-26T16:01:58 (one pharmacy above; empty = none)'
        default: ''
      restore_apply:
        description: 'Write the restored costs? (yes only after the owner approved the list / no = dry run)'
        default: 'no'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Audit stock
        env:
          RXPOS_API: https://api.rxposug.com
          OWNER_KEY: ${{ secrets.OWNER_KEY }}
          DAYS: ${{ inputs.days }}
          ONLY: ${{ inputs.pharmacies }}
        run: node tools/stock-audit.mjs $ONLY --days "${DAYS:-30}"
      - name: Cost prices (when and why each changed)
        env:
          RXPOS_API: https://api.rxposug.com
          OWNER_KEY: ${{ secrets.OWNER_KEY }}
          ONLY: ${{ inputs.pharmacies }}
        run: node tools/cost-check.mjs $ONLY --days 60
      - name: Put back costs (dry run unless restore_apply is yes)
        if: ${{ inputs.restore_costs_at != '' }}
        env:
          RXPOS_API: https://api.rxposug.com
          OWNER_KEY: ${{ secrets.OWNER_KEY }}
          APPLY: ${{ inputs.restore_apply }}
          # the owner's law (worker/ownerlaw.js): restore_apply = yes is given only after the owner approved the list
          OWNER_APPROVED: ${{ inputs.restore_apply == 'yes' && 'yes' || 'no' }}
          ONLY: ${{ inputs.pharmacies }}
          AT: ${{ inputs.restore_costs_at }}
        run: node tools/cost-restore.mjs $ONLY "$AT"
