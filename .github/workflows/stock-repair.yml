name: Stock repair

# Fixes stock problems the Stock audit finds that are safe to fix automatically, by ADDING correcting stock movements
# (history is never edited): batches below zero while the same medicine holds stock in other batches. Each medicine's
# total stock stays the same. Leave "apply" as "no" for a dry run that only prints the plan.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the corrections? (yes / no = dry run)'
        default: 'no'
      pharmacies:
        description: 'Pharmacy web addresses, space-separated (empty = all)'
        default: ''
      fixes:
        description: 'Fixes the owner decided on (writeoff-twice duplicates); empty = the automatic fixes'
        default: ''
      expect:
        description: 'With fixes: the number of movements the owner approved (anything else writes nothing)'
        default: ''

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Repair stock
        env:
          RXPOS_API: https://api.rxposug.com
          OWNER_KEY: ${{ secrets.OWNER_KEY }}
          APPLY: ${{ inputs.apply }}
          # the owner's law (worker/ownerlaw.js): the owner running this with apply = yes is the approval to write
          OWNER_APPROVED: ${{ inputs.apply == 'yes' && 'yes' || 'no' }}
          ONLY: ${{ inputs.pharmacies }}
          FIXES: ${{ inputs.fixes }}
          EXPECT: ${{ inputs.expect }}
        run: node tools/stock-repair.mjs $ONLY
