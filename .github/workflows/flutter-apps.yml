# The Flutter RxPOS apps (rxpos_flutter/), version 2.0.<run number>: tests, then the Windows installer and the Android
# apps (one APK for all phones, smaller APKs per processor, and an app bundle for app stores).
# Runs on every push that changes rxpos_flutter/ (any branch) and by hand. The live website, cloud and current
# Electron / Capacitor apps are not touched. Builds of the pilot branch are also offered to the installed new RxPOS
# apps (the R2 bucket rxpos-apps, read through the cloud at /api/app/; scripts/publish-flutter-update.sh).
name: Flutter apps

on:
  push:
    paths:
      - 'rxpos_flutter/**'
      - '.github/workflows/flutter-apps.yml'
  workflow_dispatch:

# the pilot builds are published to a pre-release (the account's artifact storage is full); the current apps update from
# the website's version.json, never from GitHub releases, so this cannot reach them
permissions:
  contents: write

concurrency:
  group: flutter-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  VERSION: 2.0.${{ github.run_number }} # 2.0.x, so the new apps never look older than the React app's 1.7.x

jobs:
  test:
    name: Analyze and test (with the real cloud code run locally)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Flutter packages
        working-directory: rxpos_flutter
        run: flutter pub get
      - name: Generated code is up to date
        working-directory: rxpos_flutter
        run: |
          dart run build_runner build
          git diff --exit-code -- lib || (echo "::error::Run 'dart run build_runner build' and commit the generated files." && exit 1)
      - name: Analyze
        working-directory: rxpos_flutter
        run: flutter analyze
      - name: Tests
        working-directory: rxpos_flutter
        run: flutter test
      - name: Start the cloud code locally (fictional data only)
        run: |
          npm ci
          npm run build
          sed 's/^\s*"ai":.*$//' wrangler.jsonc > wrangler.test.jsonc
          node node_modules/wrangler/bin/wrangler.js dev -c wrangler.test.jsonc --port 8791 --persist-to "$RUNNER_TEMP/cloud" \
            --var DB_BACKEND: --var SYNC_KEY:ci-sync-key-0123456789abcdef0123 --var OWNER_KEY:ci-owner-key-0123456789abcdef0123 \
            --var PUBLIC_URL:http://127.0.0.1:8791 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8791/api/health && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/wrangler.log"; exit 1
      - name: Tests against the real cloud code
        working-directory: rxpos_flutter
        env:
          RXPOS_CLOUD: http://127.0.0.1:8791
          RXPOS_OWNER_KEY: ci-owner-key-0123456789abcdef0123
        run: flutter test test/cloud

  android:
    name: Android apps
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Release signing (the same key as the current RxPOS Android app, when the secrets are set)
        working-directory: rxpos_flutter/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$KS_PASS" "$KS_PASS" "$KS_ALIAS" > key.properties
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Android signing secrets are not set: this APK is signed with a debug key (pilot only)."
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: rxpos_flutter
        run: |
          flutter pub get
          v="--build-name=$VERSION --build-number=${{ github.run_number }}"
          mkdir -p ../out
          if [ "$SIGNED" = release ]; then s=""; else s="-debug"; fi # debug-signed files are named so
          flutter build apk --release $v # one APK for every phone (and for copies that update from it)
          cp build/app/outputs/flutter-apk/app-release.apk "../out/RxPOS$s.apk"
          # a smaller APK per processor, numbered like the one for all (so either can update the other)
          flutter build apk --release --split-per-abi -P force-version-code-ignoring-abi=true $v
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../out/RxPOS-arm64$s.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "../out/RxPOS-armv7$s.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "../out/RxPOS-x64$s.apk"
          flutter build appbundle --release $v # for app stores (Google Play)
          cp build/app/outputs/bundle/release/app-release.aab "../out/RxPOS$s.aab"
          ls -l ../out
      - name: Remove the files with the old name (RxPOS New) from the pilot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/flutter-pilot" --jq '.assets[] | select(.name | startswith("RxPOS-New-")) | .id' 2>/dev/null); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" && echo "removed asset $id"
          done
      - name: Publish to the pilot pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-pilot # (the tag exists: moving it to each build's commit was refused by GitHub)
          name: RxPOS (Flutter) – pilot build
          prerelease: true
          make_latest: false
          body: |
            Pilot builds of the new Flutter apps (Windows and Android). They install as "RxPOS", next to the current
            RxPOS apps, and use the same pharmacy account and cloud. Not for general use yet.
          files: |
            out/*.apk
            out/*.aab
          fail_on_unmatched_files: true
      - name: Offer it to the installed apps (pilot branch, release-signed only, as a debug key can't update an install)
        if: github.ref == 'refs/heads/ccr-54387795-ifu3p1' && env.SIGNED == 'release'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          scripts/publish-flutter-update.sh android out/RxPOS.apk ${{ github.run_number }} "$VERSION"
          for abi in arm64 armv7 x64; do
            scripts/publish-flutter-update.sh "android-$abi" "out/RxPOS-$abi.apk" ${{ github.run_number }} "$VERSION"
          done

  windows:
    name: Windows installer
    needs: [test, android] # after Android, so the two never create the pilot pre-release at the same moment
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: rxpos_flutter
        run: |
          flutter pub get
          flutter build windows --release --build-name=${{ env.VERSION }} --build-number=${{ github.run_number }}
      - name: Installer and portable zip
        shell: pwsh
        run: |
          $release = "rxpos_flutter\build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path "$release\*" -DestinationPath "out\RxPOS-windows-portable.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc /DAppVersion=${{ env.VERSION }} "/DSourceDir=$((Resolve-Path $release).Path)" /Oout rxpos_flutter\windows\installer\rxpos.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item out\RxPOS-Setup-*.exe out\RxPOS-Setup.exe
      - name: Publish to the pilot pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-pilot # (the tag exists: moving it to each build's commit was refused by GitHub)
          name: RxPOS (Flutter) – pilot build
          prerelease: true
          make_latest: false
          files: |
            out/RxPOS-Setup.exe
            out/RxPOS-windows-portable.zip
          fail_on_unmatched_files: true
      - name: Offer it to the installed apps (pilot branch)
        if: github.ref == 'refs/heads/ccr-54387795-ifu3p1'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/publish-flutter-update.sh windows out/RxPOS-Setup.exe ${{ github.run_number }} "$VERSION"
