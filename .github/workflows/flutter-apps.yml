# The Flutter RxPOS apps (rxpos_flutter/), version 2.0.<run number>: tests, then the Windows installer, the Android
# apps (one APK for all phones, smaller APKs per processor, and an app bundle for app stores) and the website
# (rxposug.com: the app for the browser, with the classic app kept at /classic/). One commit, one version, all three.
# Runs on every push that changes rxpos_flutter/ (any branch) and by hand. The live website, cloud and current
# Electron / Capacitor apps are not touched. Builds of the pilot branch are also offered to the installed new RxPOS
# apps (the R2 bucket rxpos-apps, read through the cloud at /api/app/; scripts/publish-flutter-update.sh).
name: Flutter apps

on:
  push:
    paths:
      - 'rxpos_flutter/**'
      - '.github/workflows/flutter-apps.yml'
  workflow_dispatch:

# the pilot builds are published to a pre-release (the account's artifact storage is full); the current apps update from
# the website's version.json, never from GitHub releases, so this cannot reach them
permissions:
  contents: write

concurrency:
  group: flutter-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  VERSION: 2.0.${{ github.run_number }} # 2.0.x, so the new apps never look older than the React app's 1.7.x

jobs:
  test:
    name: Analyze and test (with the real cloud code run locally)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the classic app's build number is its last change (scripts/release-files.mjs)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Flutter packages
        working-directory: rxpos_flutter
        run: flutter pub get
      - name: Generated code is up to date
        working-directory: rxpos_flutter
        run: |
          dart run build_runner build
          git diff --exit-code -- lib || (echo "::error::Run 'dart run build_runner build' and commit the generated files." && exit 1)
      - name: Analyze
        working-directory: rxpos_flutter
        run: flutter analyze
      - name: Tests
        working-directory: rxpos_flutter
        run: flutter test
      - name: Start the cloud code locally (fictional data only)
        run: |
          npm ci
          npm run build
          sed 's/^\s*"ai":.*$//' wrangler.jsonc > wrangler.test.jsonc
          node node_modules/wrangler/bin/wrangler.js dev -c wrangler.test.jsonc --port 8791 --persist-to "$RUNNER_TEMP/cloud" \
            --var DB_BACKEND: --var SYNC_KEY:ci-sync-key-0123456789abcdef0123 --var OWNER_KEY:ci-owner-key-0123456789abcdef0123 \
            --var PUBLIC_URL:http://127.0.0.1:8791 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8791/api/health && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/wrangler.log"; exit 1
      - name: Tests against the real cloud code
        working-directory: rxpos_flutter
        env:
          RXPOS_CLOUD: http://127.0.0.1:8791
          RXPOS_OWNER_KEY: ci-owner-key-0123456789abcdef0123
        run: flutter test test/cloud

  android:
    name: Android apps
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the classic app's build number is its last change (scripts/release-files.mjs)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Release signing (the same key as the current RxPOS Android app, when the secrets are set)
        working-directory: rxpos_flutter/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$KS_PASS" "$KS_PASS" "$KS_ALIAS" > key.properties
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Android signing secrets are not set: this APK is signed with a debug key (pilot only)."
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: rxpos_flutter
        run: |
          # GitHub's runner was shut down for want of memory: Gradle and the Kotlin compiler are kept smaller here
          # (the user-level file overrides android/gradle.properties)
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError\nkotlin.daemon.jvmargs=-Xmx1g\norg.gradle.workers.max=2\n' > ~/.gradle/gradle.properties
          flutter pub get
          v="--build-name=$VERSION --build-number=${{ github.run_number }}"
          mkdir -p ../out
          if [ "$SIGNED" = release ]; then s=""; else s="-debug"; fi # debug-signed files are named so
          # the Gradle and Kotlin daemons are stopped after each build: kept running, they used up the runner's memory
          # and GitHub shut the runner down during the next build
          stop() { pkill -f GradleDaemon || true; pkill -f KotlinCompileDaemon || true; sleep 3; free -m | head -2; }
          flutter build apk --release $v # one APK for every phone (and for copies that update from it)
          cp build/app/outputs/flutter-apk/app-release.apk "../out/RxPOS$s.apk"
          stop
          # a smaller APK per processor, numbered like the one for all (so either can update the other)
          flutter build apk --release --split-per-abi -P force-version-code-ignoring-abi=true $v
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../out/RxPOS-arm64$s.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "../out/RxPOS-armv7$s.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "../out/RxPOS-x64$s.apk"
          stop
          flutter build appbundle --release $v # for app stores (Google Play)
          cp build/app/outputs/bundle/release/app-release.aab "../out/RxPOS$s.aab"
          ls -l ../out
      - name: Remove the files with the old name (RxPOS New) from the pilot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/flutter-pilot" --jq '.assets[] | select(.name | startswith("RxPOS-New-")) | .id' 2>/dev/null); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" && echo "removed asset $id"
          done
      - name: Publish to the pilot pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-pilot # (the tag exists: moving it to each build's commit was refused by GitHub)
          name: RxPOS (Flutter) – pilot build
          prerelease: true
          make_latest: false
          body: |
            Pilot builds of the new Flutter apps (Windows and Android). They install as "RxPOS", next to the current
            RxPOS apps, and use the same pharmacy account and cloud. Not for general use yet.
          files: |
            out/*.apk
            out/*.aab
          fail_on_unmatched_files: true
      - name: Offer it to the installed apps (pilot branch, release-signed only, as a debug key can't update an install)
        if: github.ref == 'refs/heads/ccr-54387795-ifu3p1' && env.SIGNED == 'release'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          scripts/publish-flutter-update.sh android out/RxPOS.apk ${{ github.run_number }} "$VERSION"
          for abi in arm64 armv7 x64; do
            scripts/publish-flutter-update.sh "android-$abi" "out/RxPOS-$abi.apk" ${{ github.run_number }} "$VERSION"
          done

  windows:
    name: Windows installer
    needs: [test, android] # after Android, so the two never create the pilot pre-release at the same moment
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the classic app's build number is its last change (scripts/release-files.mjs)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: rxpos_flutter
        run: |
          flutter pub get
          flutter build windows --release --build-name=${{ env.VERSION }} --build-number=${{ github.run_number }}
      - name: Installer and portable zip
        shell: pwsh
        run: |
          $release = "rxpos_flutter\build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path "$release\*" -DestinationPath "out\RxPOS-windows-portable.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc /DAppVersion=${{ env.VERSION }} "/DSourceDir=$((Resolve-Path $release).Path)" /Oout rxpos_flutter\windows\installer\rxpos.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item out\RxPOS-Setup-*.exe out\RxPOS-Setup.exe
      - name: Publish to the pilot pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-pilot # (the tag exists: moving it to each build's commit was refused by GitHub)
          name: RxPOS (Flutter) – pilot build
          prerelease: true
          make_latest: false
          files: |
            out/RxPOS-Setup.exe
            out/RxPOS-windows-portable.zip
          fail_on_unmatched_files: true
      - name: Offer it to the installed apps (pilot branch)
        if: github.ref == 'refs/heads/ccr-54387795-ifu3p1'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/publish-flutter-update.sh windows out/RxPOS-Setup.exe ${{ github.run_number }} "$VERSION"

  web:
    name: Website (the app in the browser)
    needs: [test, android] # after Android, as the Windows job: never two jobs updating the pilot release at once
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency: production-deploy # the same lock as the other website deploys (build.yml, deploy-cloud.yml)
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the classic app's build number is its last change (scripts/release-files.mjs)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: The classic app (kept at /classic/, and at the root for the installed classic apps' updates)
        run: npm ci && npm run build
      - name: The app for the browser
        working-directory: rxpos_flutter
        run: |
          flutter pub get
          # its files from /app/, no outside servers (the site's security policy), this build's number for updates
          flutter build web --release --no-web-resources-cdn --dart-define=RXPOS_WEB_BASE=/app/ --dart-define=RXPOS_BUILD=${{ github.run_number }}
      - name: Put the website together
        run: |
          scripts/build-web-site.sh dist rxpos_flutter/build/web site ${{ github.run_number }} "$VERSION"
          mkdir -p out
          printf '{"build":%s,"label":"%s"}\n' "${{ github.run_number }}" "$VERSION" > rxpos_flutter/build/web/rxpos-web.json
          (cd rxpos_flutter/build/web && zip -qr ../../../out/RxPOS-web.zip .)
      - name: Publish to the pilot pre-release (the classic deploys put the website together with it)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-pilot
          prerelease: true
          make_latest: false
          files: out/RxPOS-web.zip
          fail_on_unmatched_files: true
      - name: Browser for the checks
        if: github.ref == 'refs/heads/ccr-54387795-ifu3p1'
        run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Preview, check, go live (and back to the previous site by itself if the live check fails)
        if: github.ref == 'refs/heads/ccr-54387795-ifu3p1'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::warning::Cloudflare credentials are not set: the website was not deployed."; exit 0; fi
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/rxpos"
          prev=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/deployments?env=production&per_page=1" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).result[0]?.id||'')}catch{console.log('')}})")
          echo "Live website before this deploy: ${prev:-unknown}"
          npx wrangler pages deploy site --project-name rxpos --branch web-preview --commit-dirty=true
          ok=0; for i in 1 2 3 4 5 6; do node tests/web-site-check.mjs https://web-preview.rxpos.pages.dev ${{ github.run_number }} && { ok=1; break; }; sleep 20; done
          [ $ok = 1 ] || { echo "::error::The preview did not pass its check: the live website was not changed."; exit 1; }
          npx wrangler pages deploy site --project-name rxpos --branch main --commit-dirty=true
          ok=0; for i in 1 2 3 4 5 6; do node tests/web-site-check.mjs https://rxposug.com ${{ github.run_number }} --live && { ok=1; break; }; sleep 20; done
          if [ $ok != 1 ]; then
            if [ -n "$prev" ]; then
              curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/deployments/$prev/rollback" > /dev/null && echo "::error::The live website failed its check, so the previous website ($prev) was put back."
            else
              echo "::error::The live website failed its check and the previous one could not be found to put back."
            fi
            exit 1
          fi
          echo "rxposug.com is the RxPOS app build ${{ github.run_number }} ($VERSION); the classic app is at /classic/"

