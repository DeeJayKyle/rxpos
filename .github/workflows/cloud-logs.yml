name: Cloud logs

# Read-only diagnosis: watches the live cloud (Worker pharmapos → api.rxposug.com) for a while and prints the requests
# that failed, with their error messages. Changes nothing. Request headers and bodies (sign-in passes, pharmacy data)
# are never printed: only the method, the path, the outcome, exceptions and log lines.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'How long to watch'
        required: false
        default: '120'

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update files the apps download (read-only)
        run: |
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          for (const [name, url] of [['website', 'https://rxposug.com/version.json'], ['cloud (Android asks here)', 'https://rxposug.com/api/version'], ['cloud direct', 'https://api.rxposug.com/api/version']]) {
            try { const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' }); const v = await r.json(); console.log(name, r.status, 'build', v.build, v.label, 'zip', v.zip); } catch (e) { console.log(name, 'failed', e.message); }
          }
          const v = await (await fetch('https://rxposug.com/version.json?t=' + Date.now())).json();
          const zipUrl = 'https://rxposug.com/' + v.zip;
          const t0 = Date.now(); const r = await fetch(zipUrl); const buf = Buffer.from(await r.arrayBuffer());
          const sha = crypto.createHash('sha256').update(buf).digest('hex');
          console.log('zip', r.status, r.headers.get('content-type'), 'length header', r.headers.get('content-length'), 'got', buf.length, 'bytes in', Date.now() - t0, 'ms', 'checksum', sha === v.zipSha256 ? 'matches' : 'DIFFERS ' + sha + ' vs ' + v.zipSha256, 'starts', buf.subarray(0, 2).toString());
          const part = await fetch(zipUrl, { headers: { Range: 'bytes=100-' } });
          console.log('resume request', part.status, 'content-range', part.headers.get('content-range'), 'content-length', part.headers.get('content-length'));
          JS
      - run: npm ci
      - name: Watch the cloud
        run: timeout ${{ inputs.seconds }} npx wrangler tail pharmapos --format json > tail.jsonl || true
      - name: Failed requests (no headers, no bodies)
        run: |
          node -e '
            // wrangler prints each event as pretty-printed JSON over many lines: split on top-level objects
            const text = require("fs").readFileSync("tail.jsonl", "utf8"); const events = [];
            for (let i = 0, depth = 0, start = -1, str = false, esc = false; i < text.length; i++) {
              const c = text[i];
              if (str) { if (esc) esc = false; else if (c === "\\") esc = true; else if (c === "\"") str = false; continue; }
              if (c === "\"") str = true;
              else if (c === "{") { if (!depth++) start = i; }
              else if (c === "}" && depth && !--depth) events.push(text.slice(start, i + 1));
            }
            let all = 0, bad = 0; const seen = new Map();
            for (const l of events) {
              let e; try { e = JSON.parse(l); } catch { continue; }
              all++;
              const req = e.event && e.event.request || {};
              const path = (req.url || "").replace(/^https?:\/\/[^/]+/, "").replace(/\?.*$/, "");
              const status = e.event && e.event.response && e.event.response.status;
              const errs = (e.exceptions || []).map((x) => x.name + ": " + x.message);
              const logs = (e.logs || []).filter((x) => x.level === "error" || x.level === "warn").map((x) => [].concat(x.message).join(" ").slice(0, 300));
              if (e.outcome === "ok" && !(status >= 500) && !errs.length && !logs.length) continue;
              bad++;
              const key = [req.method, path, e.outcome, status, errs.join(" | "), logs.join(" | ")].join("  ");
              seen.set(key, (seen.get(key) || 0) + 1);
            }
            console.log(`${all} requests seen, ${bad} failed`);
            for (const [k, n] of [...seen].sort((a, b) => b[1] - a[1]).slice(0, 40)) console.log(n + "×  " + k);
          '
