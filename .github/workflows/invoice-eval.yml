name: Invoice reading check

# Measures how well "Scan invoice" reads supplier invoices: fictional invoices (tools/invoice-eval/invoices.mjs) in
# typed, partly handwritten, fully handwritten and photo styles, read by Cloudflare Workers AI vision models, every
# field scored against the known answer. Uses only fictional data; changes nothing live.
on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Models to try (space separated); blank = the usual candidates'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node tools/invoice-eval/run.mjs ${{ inputs.models }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invoice-eval
          path: invoice-eval-out
          retention-days: 7
